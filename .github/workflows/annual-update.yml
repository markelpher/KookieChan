name: Annual Update Maintenance

on:
  schedule:
    - cron: '0 0 1 12 *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME || 'Mark Elpher' }}
  GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || '84909900+markelpher@users.noreply.github.com' }}
  GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME || vars.GIT_AUTHOR_NAME || 'Mark Elpher' }}
  GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL || vars.GIT_AUTHOR_EMAIL || '84909900+markelpher@users.noreply.github.com' }}

jobs:
  update-project:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      release_target_sha: ${{ steps.release-target.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_PERSONAL_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Calculate new version
        run: |
          LAST_TAG="$(
            git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n 1
          )"

          if [ -z "${LAST_TAG:-}" ]; then
            LAST_TAG="1.3.0"
          fi

          MAJOR="$(echo "$LAST_TAG" | cut -d'.' -f1)"
          MINOR="$(echo "$LAST_TAG" | cut -d'.' -f2)"
          PATCH="$(echo "$LAST_TAG" | cut -d'.' -f3)"
          NEW_TAG="${MAJOR}.${MINOR}.$((PATCH + 1))"

          echo "LAST_TAG=$LAST_TAG" >> "$GITHUB_ENV"
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"
          echo "DATE=$(date +'%d/%m/%Y')" >> $GITHUB_ENV

      - name: Get latest Python version
        run: |
          FULL_VERSION=$(curl -s https://endoflife.date/api/python.json | jq -r '.[0].latest')
          SHORT_VERSION=$(echo $FULL_VERSION | cut -d'.' -f1,2)
          echo "PYTHON_VERSION=$SHORT_VERSION" >> $GITHUB_ENV

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure Git author
        run: |
          git config --global user.name "$GIT_COMMITTER_NAME"
          git config --global user.email "$GIT_COMMITTER_EMAIL"
          git config --global user.signingkey 8E97027279B03647

      - name: Update main branch
        run: |
          git checkout main
          sed -i "s/# Use Python .*/# Use Python ${PYTHON_VERSION}/" ./docker/dockerfile
          sed -i "s/FROM python:.*-slim/FROM python:${PYTHON_VERSION}-slim/" ./docker/dockerfile

          git add .
          git commit -S \
            -m "Release: v${NEW_TAG}" \
            -m "Python atualizado para ${PYTHON_VERSION}" || echo "No changes"
          
          git push origin main

      - name: Create new version tag
        id: release-target
        run: |
          if git rev-parse "${NEW_TAG}" >/dev/null 2>&1; then
            echo "A tag ${NEW_TAG} já existe."
            exit 1
          fi

          git tag -s "${NEW_TAG}" \
            -m "Python atualizado para ${PYTHON_VERSION}"
          git push origin "refs/tags/${NEW_TAG}"
          RELEASE_TARGET_SHA="$(git rev-parse HEAD)"
          echo "RELEASE_TARGET_SHA=$RELEASE_TARGET_SHA" >> "$GITHUB_ENV"
          echo "sha=$RELEASE_TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        run: |
          cat <<EOF > release_notes.md
          ## 👻 Kookie Chan v${NEW_TAG}

          ### Versão anual de manutenção
          - Python atualizado para **${PYTHON_VERSION}**.
          - Dependências do bot atualizadas automaticamente:
            - \`discord.py\`
            - \`aiohttp\`
            - \`beautifulsoup4\`
            - \`pymongo\`
            - \`python-dotenv\`
          - Build Docker multi-arch (AMD64 & ARM64) atualizada.
          EOF

          gh release create "${NEW_TAG}" \
            --target "${RELEASE_TARGET_SHA}" \
            --title "v${NEW_TAG}" \
            --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.MY_PERSONAL_TOKEN }}