name: Kookie Chan

on:
  push:
    branches:
      - main
      - webserver
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

env:
  IMAGE_NAME: markelpher/kookiechan

concurrency:
  group: docker-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=webserver,enable=${{ github.ref_name == 'webserver' }}

      - name: Build local for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha,scope=kookiechan-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=kookiechan-${{ github.ref_name }}

      - name: Test image (Branch Specific)
        run: |
          echo "Verificando integridade na branch: ${{ github.ref_name }}"
          if [ "${{ github.ref_name }}" = "webserver" ]; then
            docker run --rm --platform linux/amd64 ${{ env.IMAGE_NAME }}:test \
              python -c "import main; import webserver; print('Branch Webserver: OK!')"
          else
            docker run --rm --platform linux/amd64 ${{ env.IMAGE_NAME }}:test \
              python -c "import main; print('Branch Main: OK!')"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/dockerfile
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=kookiechan-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=kookiechan-${{ github.ref_name }}

      - name: Done
        run: echo "Deploy finalizado para ${{ github.ref_name }}!"