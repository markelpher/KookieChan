name: Sync Release to GitLab and Codeberg

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
    secrets:
      GITLAB_PROJECT_ID:
        required: true
      GITLAB_ACCESS_TOKEN:
        required: true
      CODEBERG_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  sync-releases:
    name: Sincronizar metadados da release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      GITHUB_TAG_SHA: ${{ inputs.sha }}
      GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
      GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
      GITLAB_API_URL: ${{ vars.GITLAB_API_URL }}
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      CODEBERG_API_URL: ${{ vars.CODEBERG_API_URL }}
      MIRROR_CODEBERG_OWNER_REPO: ${{ vars.MIRROR_CODEBERG_OWNER_REPO || 'markelpher/kookiechan' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Consultar release e sincronizar mirrors
        run: |
          set -euo pipefail
          test -n "$GITLAB_PROJECT_ID" && test -n "$GITLAB_ACCESS_TOKEN" && test -n "$CODEBERG_TOKEN"
          gh release view "$TAG" --json tagName,name,body,isPrerelease,isDraft,url > "$RUNNER_TEMP/release.json"
          python -c 'import json, os; p=os.environ["RUNNER_TEMP"]; r=json.load(open(p+"/release.json", encoding="utf-8")); event={"action":"published","release":{"tag_name":r["tagName"],"name":r["name"],"body":r["body"],"prerelease":r["isPrerelease"],"draft":r["isDraft"],"html_url":r["url"]}}; json.dump(event,open(p+"/release-event.json","w",encoding="utf-8"))'
          GITHUB_EVENT_PATH="$RUNNER_TEMP/release-event.json" python .github/scripts/sync_releases.py
