name: Docker Image Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

env:
  IMAGE_NAME: markelpher/kookiechan
  CACHE_SCOPE: kookiechan-main
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: docker-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build local for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}

      - name: Test image
        run: |
          echo "Verificando integridade da imagem..."
          docker run --rm --platform linux/amd64 ${{ env.IMAGE_NAME }}:test \
            python -c "import main; print('Integridade da Main: OK!')"

      - name: Cleanup Old Cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Limpando caches antigos do escopo: ${{ env.CACHE_SCOPE }}..."
          ids=$(gh cache list --repo ${{ github.repository }} --key ${{ env.CACHE_SCOPE }} --json id -q '.[].id')
          for id in $ids; do
            echo "Deletando ID: $id"
            gh cache delete $id --repo ${{ github.repository }}
          done
        continue-on-error: true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/dockerfile
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Done
        run: echo "Build multi-arch concluído, cache antigo removido e novo cache gerado!"