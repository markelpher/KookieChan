name: Multi-Platform Sync (Mirror Releases)

on:
  release:
    types: [published]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}
          known_hosts: 'placeholder'

      - name: Adding Known Hosts
        run: |
          ssh-keyscan codeberg.org >> ~/.ssh/known_hosts
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts

      - name: Push Mirror (Commits & Tags)
        run: |
          git remote add codeberg git@codeberg.org:markelpher/KookieChan.git || true
          git remote add gitlab git@gitlab.com:markelpher/kookiechan.git || true
          
          echo "Pushing to Codeberg..."
          git push --force codeberg main
          git push --force codeberg --tags
          
          echo "Pushing to GitLab..."
          git push --force gitlab main
          git push --force gitlab --tags
      
      - name: Create Release on GitLab
        run: |
          curl --request POST \
            --header "PRIVATE-TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "{
              \"name\": \"${{ github.event.release.tag_name }}\",
              \"tag_name\": \"${{ github.event.release.tag_name }}\",
              \"description\": \"$(echo "${{ github.event.release.body }}" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')\"
            }" \
            "https://gitlab.com/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/releases"

      - name: Create Release on Codeberg
        run: |
          curl --request POST \
            --header "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "{
              \"name\": \"${{ github.event.release.tag_name }}\",
              \"tag_name\": \"${{ github.event.release.tag_name }}\",
              \"body\": \"$(echo "${{ github.event.release.body }}" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')\",
              \"draft\": false,
              \"prerelease\": false
            }" \
            "https://codeberg.org/api/v1/repos/markelpher/KookieChan/releases"