name: Multi-Platform Sync Releases

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-releases:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.event.release.tag_name }}
      RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
      RELEASE_BODY: ${{ github.event.release.body }}
      PRERELEASE: ${{ github.event.release.prerelease }}
      GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      CODEBERG_REPO: markelpher/KookieChan

    steps:
      - name: Sync Release to GitLab
        run: |
          BODY_JSON=$(jq -Rs . <<< "$RELEASE_BODY")

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID/releases/$TAG")

          if [ "$STATUS" = "200" ]; then
            curl --request PUT \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{
                \"name\": \"$RELEASE_NAME\",
                \"description\": $BODY_JSON
              }" \
              "https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID/releases/$TAG"
          else
            curl --request POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{
                \"name\": \"$RELEASE_NAME\",
                \"tag_name\": \"$TAG\",
                \"description\": $BODY_JSON
              }" \
              "https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID/releases"
          fi

      - name: Sync Release to Codeberg
        run: |
          BODY_JSON=$(jq -Rs . <<< "$RELEASE_BODY")

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --header "Authorization: token $CODEBERG_TOKEN" \
            "https://codeberg.org/api/v1/repos/$CODEBERG_REPO/releases/tags/$TAG")

          if [ "$STATUS" = "200" ]; then
            RELEASE_ID=$(curl -s \
              --header "Authorization: token $CODEBERG_TOKEN" \
              "https://codeberg.org/api/v1/repos/$CODEBERG_REPO/releases/tags/$TAG" \
              | jq -r '.id')

            curl --request PATCH \
              --header "Authorization: token $CODEBERG_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{
                \"name\": \"$RELEASE_NAME\",
                \"body\": $BODY_JSON,
                \"prerelease\": $PRERELEASE
              }" \
              "https://codeberg.org/api/v1/repos/$CODEBERG_REPO/releases/$RELEASE_ID"
          else
            curl --request POST \
              --header "Authorization: token $CODEBERG_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{
                \"name\": \"$RELEASE_NAME\",
                \"tag_name\": \"$TAG\",
                \"body\": $BODY_JSON,
                \"draft\": false,
                \"prerelease\": $PRERELEASE
              }" \
              "https://codeberg.org/api/v1/repos/$CODEBERG_REPO/releases"
          fi