name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes Python 3.14
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Configurar Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Verificar sintaxe
        run: python -m compileall -q src tests

      - name: Verificar lint com pre-commit/Ruff
        run: pre-commit run --all-files

      - name: Verificar tipos
        run: pyright

      - name: Verificar vulnerabilidades das dependências
        run: pip-audit -r requirements.txt

      - name: Executar testes
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

  docker:
    name: Validar imagem Docker
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Habilitar emulação ARM64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validar configuração do Compose
        run: |
          cp .env.example .env
          docker compose -f docker/docker-compose.yml config --quiet

      - name: Compilar imagem AMD64
        run: docker buildx build --platform linux/amd64 --load --file docker/Dockerfile --tag kookiechan:ci-amd64 .

      - name: Verificar imagem AMD64
        run: |
          docker run --rm --platform linux/amd64 kookiechan:ci-amd64 python -c \
            "import os, src.main, src.cogs.config, src.cogs.help, src.cogs.history, src.cogs.ping, src.cogs.presence, src.cogs.status, src.cogs.update; assert os.getuid() != 0; print('Imports AMD64 e usuário não root: OK!')"

      - name: Compilar imagem ARM64
        run: docker buildx build --platform linux/arm64 --load --file docker/Dockerfile --tag kookiechan:ci-arm64 .

      - name: Verificar imagem ARM64
        run: |
          docker run --rm --platform linux/arm64 kookiechan:ci-arm64 python -c \
            "import os, src.main, src.cogs.config, src.cogs.help, src.cogs.history, src.cogs.ping, src.cogs.presence, src.cogs.status, src.cogs.update; assert os.getuid() != 0; print('Imports ARM64 e usuário não root: OK!')"

  release:
    name: Publicar release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [test, docker]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
      sha: ${{ github.sha }}
    secrets: inherit
