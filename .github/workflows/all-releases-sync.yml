name: Sync All Releases

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-all-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Sync GitHub Releases to GitLab and Codeberg
        env:
          GH_REPO: ${{ github.repository }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_REPO: markelpher/KookieChan
        run: |
          page=1

          while true; do
            releases=$(curl -s \
              "https://api.github.com/repos/$GH_REPO/releases?per_page=100&page=$page")

            count=$(echo "$releases" | jq 'length')

            if [ "$count" -eq 0 ]; then
              break
            fi

            echo "$releases" | jq -c '.[]' | while read release; do
              TAG=$(echo "$release" | jq -r '.tag_name')
              NAME=$(echo "$release" | jq -r '.name // .tag_name')
              BODY=$(echo "$release" | jq -r '.body // ""')
              PRERELEASE=$(echo "$release" | jq -r '.prerelease')

              BODY_JSON=$(jq -Rs . <<< "$BODY")

              echo "Syncing release: $TAG"

              # GitLab: cria ou atualiza
              GL_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
                --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                "https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID/releases/$TAG")

              if [ "$GL_EXISTS" = "200" ]; then
                curl --request PUT \
                  --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                  --header "Content-Type: application/json" \
                  --data "{
                    \"name\": \"$NAME\",
                    \"description\": $BODY_JSON
                  }" \
                  "https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID/releases/$TAG"
              else
                curl --request POST \
                  --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                  --header "Content-Type: application/json" \
                  --data "{
                    \"name\": \"$NAME\",
                    \"tag_name\": \"$TAG\",
                    \"description\": $BODY_JSON
                  }" \
                  "https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID/releases"
              fi

              # Codeberg: cria ou atualiza
              CB_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
                --header "Authorization: token $CODEBERG_TOKEN" \
                "https://codeberg.org/api/v1/repos/$CODEBERG_REPO/releases/tags/$TAG")

              if [ "$CB_EXISTS" = "200" ]; then
                RELEASE_ID=$(curl -s \
                  --header "Authorization: token $CODEBERG_TOKEN" \
                  "https://codeberg.org/api/v1/repos/$CODEBERG_REPO/releases/tags/$TAG" \
                  | jq -r '.id')

                curl --request PATCH \
                  --header "Authorization: token $CODEBERG_TOKEN" \
                  --header "Content-Type: application/json" \
                  --data "{
                    \"name\": \"$NAME\",
                    \"body\": $BODY_JSON,
                    \"prerelease\": $PRERELEASE
                  }" \
                  "https://codeberg.org/api/v1/repos/$CODEBERG_REPO/releases/$RELEASE_ID"
              else
                curl --request POST \
                  --header "Authorization: token $CODEBERG_TOKEN" \
                  --header "Content-Type: application/json" \
                  --data "{
                    \"name\": \"$NAME\",
                    \"tag_name\": \"$TAG\",
                    \"body\": $BODY_JSON,
                    \"draft\": false,
                    \"prerelease\": $PRERELEASE
                  }" \
                  "https://codeberg.org/api/v1/repos/$CODEBERG_REPO/releases"
              fi
            done

            page=$((page + 1))
          done