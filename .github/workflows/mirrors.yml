name: Mirror to Codeberg and GitLab

on:
  push:
    branches:
      - "**"
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  git-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Refresh GitHub refs
        run: git fetch origin "+refs/heads/*:refs/mirror/heads/*" "+refs/tags/*:refs/tags/*" --prune --prune-tags

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}
          known_hosts: 'placeholder'

      - name: Adding Known Hosts
        run: |
          ssh-keyscan codeberg.org >> ~/.ssh/known_hosts
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts

      - name: Mirror to Codeberg
        run: |
          git remote add codeberg git@codeberg.org:markelpher/KookieChan.git || true
          git push --force --prune codeberg "refs/mirror/heads/*:refs/heads/*" "refs/tags/*:refs/tags/*"

      - name: Mirror to GitLab
        run: |
          git remote add gitlab git@gitlab.com:markelpher/kookiechan.git || true
          git push --force --prune gitlab "refs/mirror/heads/*:refs/heads/*" "refs/tags/*:refs/tags/*"